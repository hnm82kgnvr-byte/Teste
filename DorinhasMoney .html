<style>

  --font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1620; --surface:#17202b; --ink:#eaf0f5; --ink2:#b4c0cb; --mute:#93a1ae; --line:#263341; --track:#243140;
  --accent:#3987e5; --accent-ink:#0b1118; --s2:#d95926; --neg:#6f7d8a; --warn-bg:#2b2112; --warn-ink:#f0c98a; --up:#4cc97a; --down:#f27474; --up-bg:#15301f; --down-bg:#3a1c1c; --m1:#3987e5; --m2:#d95926; --m3:#9085e9; --m4:#e0699a; --amber:#e0a100; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1620; --surface:#17202b; --ink:#eaf0f5; --ink2:#b4c0cb; --mute:#93a1ae; --line:#263341; --track:#243140;
  --accent:#3987e5; --accent-ink:#0b1118; --s2:#d95926; --neg:#6f7d8a; --warn-bg:#2b2112; --warn-ink:#f0c98a; --up:#4cc97a; --down:#f27474; --up-bg:#15301f; --down-bg:#3a1c1c; --m1:#3987e5; --m2:#d95926; --m3:#9085e9; --m4:#e0699a; --amber:#e0a100; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}

button{cursor:pointer}

.brand{font-weight:700;font-size:1.05rem;letter-spacing:-.01em}

.grp{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.grp:first-of-type{border-top:0;padding-top:0;margin-top:0}
.grp>summary{list-style:none;display:flex;justify-content:space-between;gap:12px;font-weight:600;cursor:pointer;padding:4px 0}

.as{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;padding:9px 0;border-top:1px solid var(--line)}
.as:first-of-type{border-top:0}
.as .n{font-weight:500;overflow-wrap:anywhere}

.as .q{text-align:right;font-size:.78rem;color:var(--mute)}

.meta{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;padding:6px 0}
.meta span:first-child{color:var(--ink2)}
.demo{background:var(--ink);color:var(--surface);text-align:center;font-size:.8rem;padding:6px}
.t{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.t .field input{text-align:right}

.up{color:var(--up)}.down{color:var(--down)}
.hero .sub .up,.hero .sub .down{font-weight:600}
.seg{display:flex;gap:2px;height:14px;margin-bottom:10px}
.seg i{display:block;border-radius:3px;min-width:3px}
.mk{display:grid;gap:14px}
.mh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline}
.mh .nm{font-weight:650}
.mh .nm .sw{width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.mh .bt{grid-column:1/-1;height:10px;border-radius:5px;margin-top:4px}
.kids{display:grid;gap:8px;margin-top:10px;padding-left:20px}
.kids .bt{height:6px;border-radius:3px}
.kids .bl{font-weight:450;font-size:.9rem}
.bs{font-size:.74rem;font-weight:500;color:var(--ink2)}
.bars.thin .bt{height:6px}
.badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:.72rem;font-weight:650;letter-spacing:.02em;vertical-align:1px;margin-left:6px}
.badge.alerta{background:var(--down-bg);color:var(--down)}
.badge.atencao{background:var(--warn-bg);color:var(--warn-ink)}
.badge.ok{background:var(--up-bg);color:var(--up)}
.bk{border-top:1px solid var(--line);padding:12px 0}
.bk:first-of-type{border-top:0;padding-top:0}
.bk>summary{list-style:none;cursor:pointer}
.bk>summary::-webkit-details-marker{display:none}
.bk .top2{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-weight:600}
.bk .top2 span.v{font-weight:500;color:var(--ink2);white-space:nowrap}
.tk{position:relative;height:8px;border-radius:4px;background:var(--track);margin:10px 0 4px}
.tk i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--m1)}
.tk i.atencao{background:var(--amber)}.tk i.alerta{background:var(--down)}
.tk u{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px}
.tk u.l5{background:var(--amber)}.tk u.l10{background:var(--down)}
.thr{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.8rem;color:var(--ink2);margin-top:10px}
.thr u{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px;text-decoration:none}
.tl{font-size:.82rem;color:var(--ink2);padding:6px 0 0 0;display:grid;gap:6px}
.tl div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px}
.tl .m{font-size:.74rem;color:var(--mute)}
.vv{font-size:.8rem;font-weight:600}
.summ{display:grid;gap:2px}
.enq{display:grid;gap:10px;margin-top:12px}
.enq .m{font-size:.84rem;color:var(--ink2);margin-top:2px}
.kpi .d b{font-weight:650}
.kpi .v{font-size:1.5rem}
.kpi .v.up,.kpi .v.down{font-weight:700}
@media (prefers-reduced-motion:no-preference){.bt i{transition:width .4s ease}}
@media print{.top,.toast{display:none}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
/* ===== núcleo: sem DOM, testável em Node ===== */
const CATS = ['Renda Fixa - Pós','Renda Fixa - Inflação','Renda Fixa - Pré','Caixa','Reserva','FII','Bolsa Americana','Bolsa Brasil','Multimercado','Cripto'];
const BAL_CATS = ['Renda Fixa - Pós','Renda Fixa - Inflação','Bolsa Americana','Bolsa Brasil','Caixa','Renda Fixa - Pré','FII','Cripto'];
const DEFAULT_TARGETS = {'Renda Fixa - Pós':30,'Renda Fixa - Inflação':20,'Bolsa Americana':15,'Bolsa Brasil':15,'Caixa':7,'Renda Fixa - Pré':7,'FII':5,'Cripto':1};
const RF = ['Renda Fixa - Pós','Renda Fixa - Inflação','Renda Fixa - Pré'];

function normH(s){return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toLowerCase();}
function serialToISO(n){return new Date(Date.UTC(1899,11,30)+Math.floor(n)*864e5).toISOString().slice(0,10);}
function toISO(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return v>20000?serialToISO(v):null;
  if(v instanceof Date){const x=new Date(v.getTime()+12*36e5);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
  const s=String(v).trim();
  let m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if(m)return m[3]+'-'+m[2]+'-'+m[1];
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return m[1]+'-'+m[2]+'-'+m[3];
  return null;
}
function num(v){return typeof v==='number'&&isFinite(v)?v:null;}
function sheetRows(XLSX,wb,wanted){
  const name=wb.SheetNames.find(n=>normH(n)===wanted);
  if(!name)throw new Error('Aba "'+wanted+'" não encontrada na planilha.');
  return XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
}
function colMap(header,names){
  const idx={};const h=header.map(normH);
  for(const k in names){idx[k]=h.indexOf(names[k]);}
  return idx;
}
function parseWorkbook(XLSX,wb){
  const A=sheetRows(XLSX,wb,'analitico');
  const c=colMap(A[0],{d:'data',cat:'categoria',at:'ativo',tipo:'tipo',idx:'indexador',tx:'taxa',pos:'posicao',v:'vencimento',inst:'instituicao',sub:'subcategoria'});
  for(const k of ['d','cat','pos'])if(c[k]<0)throw new Error('Coluna "'+k+'" não encontrada na aba Analítico.');
  const rows=[];
  for(let i=1;i<A.length;i++){
    const r=A[i];const d=toISO(r[c.d]);const pos=num(r[c.pos]);const cat=r[c.cat]==null?null:String(r[c.cat]).trim();
    if(!d||pos==null||!cat)continue;
    const g=k=>c[k]>=0&&r[c[k]]!=null&&!/^n\/?a$/i.test(String(r[c[k]]).trim())?r[c[k]]:null;
    rows.push({d,cat,at:g('at')?String(g('at')).trim():null,tipo:g('tipo'),idx:g('idx'),tx:num(r[c.tx]),pos,v:toISO(r[c.v]),inst:g('inst')?String(g('inst')).trim():null,sub:g('sub')});
  }
  const R=sheetRows(XLSX,wb,'rentabilidade');
  const q=colMap(R[0],{m:'mes',mov:'movimentacao',pos:'posicao',vr:'var',cdi:'varcdi'});
  const rent=[];
  for(let i=1;i<R.length;i++){
    const r=R[i];const m=toISO(r[q.m]);if(!m)continue;
    rent.push({m:m.slice(0,7),mov:num(r[q.mov])||0,pos:num(r[q.pos])||0,vr:num(r[q.vr]),cdi:num(r[q.cdi])||0});
  }
  if(!rows.length)throw new Error('A aba Analítico não tem linhas válidas.');
  return {rows,rent};
}
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function groupSum(rows,key){const m={};for(const r of rows){const k=r[key]||'Sem informação';m[k]=(m[k]||0)+r.pos;}return m;}
function months(rows){return [...new Set(rows.map(r=>r.d))].sort();}
function bucketDays(r,d){
  if(!r.v)return null;return Math.round((Date.parse(r.v)-Date.parse(d))/864e5);
}
function perf(rent){
  // retorno de cada mês é medido até o mês seguinte (convenção da planilha)
  const out=[];let a=1,b=1;
  for(let i=0;i<rent.length;i++){
    const r=rent[i];if(r.vr==null)continue;
    a*=1+r.vr;b*=1+r.cdi;
    const end=rent[i+1]?rent[i+1].m:r.m;
    out.push({m:end,vr:r.vr,cdi:r.cdi,acc:a-1,accCdi:b-1});
  }
  return out;
}
function balance(rows,d,targets){
  const s=rows.filter(r=>r.d===d);
  const tot=groupSum(s,'cat');
  const base=BAL_CATS.reduce((x,k)=>x+(tot[k]||0),0);
  return {base,items:BAL_CATS.map(k=>{
    const ideal=(targets[k]||0)/100,atual=base?(tot[k]||0)/base:0;
    return {cat:k,ideal,atual,diff:ideal-atual,valor:(ideal-atual)*base};
  })};
}
function prazoAnos(rows,d){
  const rf=rows.filter(r=>r.d===d&&RF.includes(r.cat)&&r.v);
  const t=sum(rows.filter(r=>r.d===d),r=>r.pos);return t?sum(rf,r=>r.pos*Math.max(0,(Date.parse(r.v)-Date.parse(d))/864e5/360))/t:0;
}
function rateStr(r){
  if(r.tx==null)return r.idx||'—';
  if(r.tx===0)return '—';
  const f=(x,n)=>(x*100).toFixed(n).replace('.',',');
  if(r.idx==='CDI')return f(r.tx,1)+'% CDI';
  if(r.idx==='IPCA')return 'IPCA + '+f(r.tx,2)+'%';
  if(r.idx==='Pré'&&r.tx>0.5)return f(r.tx,1)+'% (conferir)';
  return f(r.tx,2)+'% a.a.';
}
function checks(rows,d){
  const out=[];
  for(const r of rows.filter(x=>x.d===d&&x.at)){
    if((RF.includes(r.cat)||r.cat==='Caixa')&&r.tipo!=='Fundo'){
      if(r.v&&r.v<d)out.push({a:r.at,m:'vencimento anterior à data da posição ('+r.v.split('-').reverse().join('/')+')'});
      if(r.idx==='Pré'&&r.tx!=null&&r.tx>0.5)out.push({a:r.at,m:'indexador Pré com taxa de '+(r.tx*100).toFixed(1).replace('.',',')+'%, parece ser % do CDI'});
    }
  }
  return out;
}
function demoData(){
  const rows=[],rent=[];const tot0=100000;let pos=tot0;
  const split={'Renda Fixa - Pós':.26,'Renda Fixa - Inflação':.2,'Renda Fixa - Pré':.07,'Caixa':.12,'Reserva':.1,'FII':.05,'Bolsa Americana':.12,'Bolsa Brasil':.06,'Multimercado':.015,'Cripto':.01};
  let a=0;
  for(let i=0;i<25;i++){
    const y=2024+Math.floor((6+i)/12),mo=(6+i)%12+1,m=y+'-'+String(mo).padStart(2,'0');
    const mov=i%6===5?18000+i*300:(i%4===0?-1200:900);
    const vr=0.011+0.012*Math.sin(i*1.7)+0.004*Math.cos(i*.6);
    pos=pos*(1+vr)+mov;
    rent.push({m,mov,pos,vr:i<24?vr:null,cdi:0.0105+0.0012*Math.sin(i)});
    if(i===24){
      const d=m+'-01';
      for(const k of CATS){
        const tv=pos*split[k];const n=RF.includes(k)?4:(k==='Reserva'||k==='Caixa'?1:3);
        for(let j=0;j<n;j++){
          const ven=RF.includes(k)?(2026+Math.floor(j/2)+1)+'-'+String(3+j*2).padStart(2,'0')+'-15':d;
          rows.push({d,cat:k,at:(RF.includes(k)?'CDB Exemplo '+String.fromCharCode(65+j):k==='Caixa'?'Caixa exemplo':k==='Reserva'?'Reserva exemplo':'Ativo '+k.slice(0,3).toUpperCase()+(j+1)),tipo:'Ativo',idx:k==='Renda Fixa - Pós'||k==='Caixa'?'CDI':k==='Renda Fixa - Pré'?'Pré':k==='Renda Fixa - Inflação'?'IPCA':null,tx:k==='Renda Fixa - Pós'?1.08+j*.02:k==='Renda Fixa - Pré'?.145:k==='Renda Fixa - Inflação'?.07:null,pos:tv/n,v:ven,inst:j%2?'Banco B':'Corretora A',sub:RF.includes(k)?'CDB':'Exemplo'});
        }
      }
    }
  }
  return {rows,rent};
}

/* ===== v2: macro/micro, concentração por banco, decomposição ===== */
const MACRO_OF={'Renda Fixa - Pós':'Renda Fixa','Renda Fixa - Inflação':'Renda Fixa','Renda Fixa - Pré':'Renda Fixa','FII':'Renda Variável','Bolsa Americana':'Renda Variável','Bolsa Brasil':'Renda Variável','Cripto':'Alternativos','Multimercado':'Alternativos','Caixa':'Liquidez','Reserva':'Liquidez'};
const MACROS=['Renda Fixa','Renda Variável','Alternativos','Liquidez','Outros'];
function macroTree(rows,d){
  const tot=groupSum(rows.filter(r=>r.d===d),'cat');
  return MACROS.map(m=>{
    const kids=Object.keys(tot).filter(c=>(MACRO_OF[c]||'Outros')===m).map(c=>({cat:c,v:tot[c]})).filter(x=>Math.abs(x.v)>0.005).sort((a,b)=>b.v-a.v);
    return {macro:m,v:sum(kids,k=>k.v),kids};
  }).filter(m=>m.kids.length).sort((a,b)=>b.v-a.v);
}
const BANK_RE=/^(CDB|RDB|LCI|LCA)\s+(.+)$/i;
function issuerOf(r){const m=r.at&&r.at.match(BANK_RE);return m?m[2].trim().replace(/\s+/g,' '):null;}
function bankConc(rows,d){
  const s=rows.filter(r=>r.d===d);const pl=sum(s,r=>r.pos);
  const items=s.filter(r=>issuerOf(r));const map={};
  for(const r of items){const b=issuerOf(r),k=b.toLowerCase();(map[k]=map[k]||{name:b,pos:0,items:[]});map[k].pos+=r.pos;map[k].items.push(r);}
  const banks=Object.values(map).map(b=>{
    b.share=pl?b.pos/pl:0;b.status=b.share>0.10?'alerta':b.share>0.05?'atencao':'ok';
    b.items.sort((x,y)=>(x.v||'0').localeCompare(y.v||'0'));
    const fut=b.items.filter(i=>i.v&&i.v>d).map(i=>i.v).sort();b.next=fut[0]||null;return b;
  }).sort((a,b)=>b.pos-a.pos);
  return {pl,total:sum(banks,b=>b.pos),banks,items};
}
const MAT_B=[['À vista ou vencido',null,0],['Até 3 meses',0,92],['3 a 6 meses',92,183],['6 a 12 meses',183,365],['1 a 2 anos',365,730],['Mais de 2 anos',730,1e9]];
function maturity(items,d){
  const B=MAT_B.map(([k,a,b])=>({k,a,b,v:0}));
  for(const r of items){
    const days=r.v?Math.round((Date.parse(r.v)-Date.parse(d))/864e5):0;
    const t=days<=0?B[0]:B.find(x=>x.a!=null&&days>x.a&&days<=x.b);(t||B[B.length-1]).v+=r.pos;
  }
  const total=sum(B,x=>x.v);let acc=0;
  B.forEach(x=>{acc+=x.v;x.rem=Math.max(0,total-acc);x.share=total?x.v/total:0;});
  return B;
}
function decay(items,d){
  const total=sum(items,r=>r.pos);const ev={};
  for(const r of items){const t=r.v&&r.v>d?r.v:d;ev[t]=(ev[t]||0)+r.pos;}
  let rem=total;const pts=Object.keys(ev).sort().map(t=>{rem-=ev[t];return {t,out:ev[t],rem:Math.max(0,rem)};});
  return {total,pts};
}
function decomp(rent){
  const R=rent.filter(r=>r.pos>0);if(!R.length)return [];
  let ap=R[0].pos;const out=[{m:R[0].m,pos:R[0].pos,ap,rt:0}];
  for(let i=1;i<R.length;i++){ap+=R[i].mov;out.push({m:R[i].m,pos:R[i].pos,ap,rt:R[i].pos-ap});}
  return out;
}
function prazoBuckets(rows,d){
  const s=rows.filter(r=>r.d===d);const bk=[['Até 2 dias',0,2],['Até 1 mês',2,30],['Até 1 ano',30,365],['Até 2 anos',365,730],['Mais de 2 anos',730,1e9]].map(([k,a,b])=>({k,a,b,v:0}));
  for(const r of s){const dd=bucketDays(r,d);if(dd==null)continue;(bk.find(x=>dd<=x.b)||bk[bk.length-1]).v+=r.pos;}
  return bk;
}

/* ===== v3: decaimento por banco desenquadrado e rendimentos ===== */
function bankDecay(banks,pl,d){
  return banks.filter(b=>b.share>0.05).map(b=>{
    const ev={};b.items.filter(i=>i.v&&i.v>d).forEach(i=>{ev[i.v]=(ev[i.v]||0)+i.pos;});
    const liq=sum(b.items.filter(i=>!(i.v&&i.v>d)),i=>i.pos);
    let rem=b.pos;const pts=Object.keys(ev).sort().map(t=>{rem-=ev[t];return {t,out:ev[t],rem:Math.max(0,rem),share:Math.max(0,rem)/pl};});
    const when=lim=>b.share<=lim?null:((pts.find(p=>p.share<=lim+1e-12)||{}).t||null);
    return {name:b.name,pos:b.pos,ex10:Math.max(0,b.pos-0.10*pl),ex5:Math.max(0,b.pos-0.05*pl),share:b.share,status:b.status,liq,liqShare:pl?liq/pl:0,pts,t10:when(0.10),t5:when(0.05),items:b.items};
  });
}
function shareAt(dc,t){let s=dc.share;for(const p of dc.pts){if(p.t<=t)s=p.share;}return s;}
function bankTitles(decs,d){
  const out=[];
  for(const dc of decs){
    const byDate={};dc.pts.forEach(p=>byDate[p.t]=p);
    dc.items.filter(i=>i.v&&i.v>d).forEach(i=>out.push({t:i.v,bank:dc.name,at:i.at,pos:i.pos,after:byDate[i.v].share}));
    const aft=Math.max(0,dc.share-dc.liqShare);
    dc.items.filter(i=>!(i.v&&i.v>d)).forEach(i=>out.push({t:'',daily:true,bank:dc.name,at:i.at,pos:i.pos,after:aft}));
  }
  return out.sort((a,b)=>(a.daily?0:1)-(b.daily?0:1)||a.t.localeCompare(b.t)||b.pos-a.pos);
}
function ganhos(rent){
  const R=rent.filter(r=>r.pos>0);if(R.length<2)return {p0:0,m0:null,pts:[]};
  const p0=R[0].pos;let cum=0;const pts=[];
  for(let k=0;k<R.length-1;k++){
    const a=R[k],b=R[k+1];const g=b.pos-a.pos-a.mov;cum+=g;const base=b.pos-p0;
    pts.push({m:a.m,mf:b.m,ini:a.pos,fim:b.pos,ap:a.mov,g,cum,share:Math.abs(base)>1?cum/base:null});
  }
  return {p0,m0:R[0].m,pts};
}

const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

/* ---- cofre local (IndexedDB + AES-GCM) ---- */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('carteira-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
async function kvGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}catch(e){return mem[k];}}
async function kvSet(k,v){mem[k]=v;try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});return true;}catch(e){return false;}}
async function kvDel(k){delete mem[k];try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){}}
const enc=new TextEncoder(),dec=new TextDecoder();
async function derive(pass,salt){const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function seal(){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(S)));
  vault={v:1,salt:vault.salt,iv:Array.from(iv),ct:Array.from(new Uint8Array(ct))};
  return kvSet('vault',vault);
}
async function save(){if(demo||!key)return true;return seal();}
async function openVault(pass){
  const k=await derive(pass,new Uint8Array(vault.salt));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(vault.iv)},k,new Uint8Array(vault.ct));
  key=k;S=JSON.parse(dec.decode(pt));
}

const CH=[];
function niceScale(min,max,n=4){
  if(min===max){max=min+1;}
  const span=max-min,s0=span/n,mag=Math.pow(10,Math.floor(Math.log10(s0))),nm=s0/mag;
  const step=(nm<1.5?1:nm<3?2:nm<7?5:10)*mag;
  const lo=Math.floor(min/step+1e-9)*step,hi=Math.ceil(max/step-1e-9)*step;
  const t=[];for(let v=lo;v<=hi+step/2;v+=step)t.push(+v.toFixed(10));
  return {lo,hi:t[t.length-1],t};
}
function wrap(cfg,inner,leg){

function chart(cfg){
  const W=360,H=190,L=46,R=10,T=8,B=24;
  const all=cfg.series.flatMap(s=>s.vals).filter(v=>v!=null);
  let mn=Math.min(...all),mx=Math.max(...all);
  if(cfg.type==='bar'){mn=Math.min(mn,0);mx=Math.max(mx,0);}
  if(cfg.type==='area')mn=Math.min(0,mn);
  const sc=niceScale(mn,mx);const n=cfg.labels.length;
  const X=i=>cfg.type==='bar'?L+(i+.5)*(W-L-R)/n:L+(n>1?i*(W-L-R)/(n-1):(W-L-R)/2);
  const Y=v=>T+(sc.hi-v)/(sc.hi-sc.lo)*(H-T-B);

  g+=li.map(i=>`<text x="${X(i)}" y="${H-6}" text-anchor="${cfg.type==='bar'?'middle':i===0?'start':i===n-1?'end':'middle'}">${cfg.labels[i]}</text>`).join('');

    m+=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mute)" stroke-width="1"/>`;
  }else{
    for(const s of cfg.series){
      const pts=s.vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
      const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
      if(cfg.type==='area')m+=`<path d="${d} L${pts[pts.length-1][0].toFixed(1)} ${Y(sc.lo)} L${pts[0][0].toFixed(1)} ${Y(sc.lo)} Z" fill="${s.color}" opacity=".14"/>`;

    }

  }

  cfg.tip=i=>`<b>${cfg.labels[i]}</b>`+cfg.series.map(s=>s.vals[i]==null?'':`<div>${cfg.series.length>1?`<i class="sw" style="background:${s.color}"></i>${s.name}: `:''}${cfg.fmt(s.vals[i])}</div>`).join('');

function hover(e){
  const w=e.target.closest&&e.target.closest('.chart');
  document.querySelectorAll('.chart').forEach(x=>{if(x!==w){x.querySelector('.tip').hidden=true;x.querySelector('.xh').setAttribute('visibility','hidden');}});
  if(!w)return;
  const cfg=CH[+w.dataset.ci];if(!cfg||(!cfg.xs&&!cfg.ys))return;
  const svg=w.querySelector('svg'),r=svg.getBoundingClientRect();
  const tip=w.querySelector('.tip'),xh=w.querySelector('.xh');
  if(cfg.ys){
    const fy=(e.clientY-r.top)/r.height*cfg.H;let best=0,bd=1e9;cfg.ys.forEach((y,i)=>{const d=Math.abs(y-fy);if(d<bd){bd=d;best=i;}});
    xh.setAttribute('visibility','hidden');tip.innerHTML=cfg.tip(best);tip.hidden=false;
    tip.style.top=Math.max(0,cfg.ys[best]/cfg.H*r.height+14)+'px';tip.style.left=Math.max(0,Math.min(r.width-tip.offsetWidth,cfg.xTip/cfg.W*r.width))+'px';return;
  }
  const fx=(e.clientX-r.left)/r.width*cfg.W;
  let best=0,bd=1e9;cfg.xs.forEach((x,i)=>{const d=Math.abs(x-fx);if(d<bd){bd=d;best=i;}});
  const x=cfg.xs[best];xh.setAttribute('x1',x);xh.setAttribute('x2',x);xh.setAttribute('visibility','visible');
  tip.innerHTML=cfg.tip(best);tip.hidden=false;tip.style.top='0px';
  const px=x/cfg.W*r.width,tw=tip.offsetWidth;tip.style.left=Math.max(0,Math.min(r.width-tw,px-tw/2))+'px';
}

function bindTargets(f){
  const upd=()=>{let t=0;f.querySelectorAll('[data-t]').forEach(i=>t+=parseFloat(i.value.replace(',','.'))||0);$('#tsum').innerHTML='<b>'+String(+t.toFixed(2)).replace('.',',')+'%</b>';return t;};

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-view],[data-act],[data-range],[data-alloc]');if(!t||!S)return;
  if(t.dataset.alloc){allocMode=t.dataset.alloc;render();return;}
  if(t.dataset.view){view=t.dataset.view;wipeArm=false;render();scrollTo(0,0);return;}
  if(t.dataset.range){range=t.dataset.range;render();return;}
  const a=t.dataset.act;
  if(a==='goMais'){view='mais';render();}
  else if(a==='pick')$('#xin').click();
  else if(a==='lock')lock();
  else if(a==='pdf'){t.disabled=true;t.textContent='Gerando PDF…';try{await makePdf();}catch(x){console.error(x);toast('Não foi possível gerar o PDF.');}render();}
  else if(a==='backup'){await saveFile('carteira-backup.json',new Blob([JSON.stringify(vault)],{type:'application/json'}));}
  else if(a==='wipe'){if(!wipeArm){wipeArm=true;render();return;}await kvDel('vault');vault=null;wipeArm=false;S=null;key=null;renderLock();toast('Dados apagados deste aparelho.');}
});

async function importFile(f){
  if(!f)return;
  try{
    if(typeof XLSX==='undefined')throw new Error('Biblioteca de leitura de planilhas não carregou. Verifique a conexão e abra de novo.');
    const buf=await f.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});
    const r=parseWorkbook(XLSX,wb);
    S.rows=r.rows;S.rent=r.rent;cur=null;S.imported=new Date().toLocaleDateString('pt-BR')+' · '+f.name;
    await save();view='resumo';render();
    const ms=months(S.rows);toast(`Planilha lida: ${ms.length} meses, posição de ${ml(ms[ms.length-1])}.`);
  }catch(err){toast(err.message||'Não foi possível ler a planilha.');}
}
async function saveFile(name,blob){
  let dl=null;try{if(typeof claude!=='undefined')dl=await claude.use('downloads');}catch(e){}
  try{
    if(dl){await dl.save({filename:name,data:blob});toast('Arquivo pronto.');}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
  }catch(e){if(!e||e.code!=='declined')toast('Não foi possível salvar o arquivo.');}
}

async function makePdf(){

  const R=v=>(v<0?'-':'')+'R$ '+nf0.format(Math.abs(v));
  const SR=v=>(v>=0?'+':'-')+'R$ '+nf0.format(Math.abs(v));

  const T=(s,x,y,o={})=>{s=String(s).replace(/—/g,'-');doc.setFont('helvetica',o.b?'bold':'normal');doc.setFontSize(o.s||9);tc(o.c||K.ink);doc.text(String(s),x,y,{align:o.a||'left'});};
  const tw=(s,size,b)=>{doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(size);return doc.getTextWidth(String(s));};
  const fit=(s,w,size,b)=>{s=String(s);if(tw(s,size,b)<=w)return s;while(s.length>1&&tw(s+'...',size,b)>w)s=s.slice(0,-1);return s.trim()+'...';};

  const ln=(x1,y1,x2,y2,col,w)=>{dc(col);doc.setLineWidth(w||.2);doc.line(x1,y1,x2,y2);};
  const poly=(p,fill,stroke,lw)=>{
